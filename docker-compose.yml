services:
  postgres:
    image: postgres:17
    container_name: attendance-platform-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - attendance_platform_postgres_data:/var/lib/postgresql/data

volumes:
  attendance_platform_postgres_data:
